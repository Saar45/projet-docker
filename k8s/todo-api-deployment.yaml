apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
  labels:
    app: todo-api
spec:
  replicas: 3
  # Zéro baisse de capacité pendant une mise à jour : un pod de plus est
  # autorisé temporairement (maxSurge), jamais un pod de moins (maxUnavailable).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          # Le sha d'un commit dont la pipeline est verte, jamais latest :
          # c'est la pipeline qui mettra ce tag à jour à chaque push (phase 5).
          image: nabysarr16/todo-api:2fc5e6cc4ff947c250aac16ea3d0f98eb64a1b64
          ports:
            - containerPort: 3000
          # requests : ce que le pod réserve au placement (mesuré : ~47Mi/25m au repos)
          # limits : ce qu'il ne doit jamais dépasser — dépasser la mémoire = OOMKilled
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          # Toute la configuration vient du cluster, rien de l'image :
          # envFrom déverse chaque clé des deux objets en variable d'environnement.
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          # "Ce pod est-il prêt à recevoir du trafic ?" — si non, il est retiré
          # du Service sans être redémarré, le temps de se rétablir.
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          # "Ce pod est-il toujours vivant ?" — si non, le conteneur est tué
          # et redémarré. Délai initial plus large : on laisse l'app démarrer.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
