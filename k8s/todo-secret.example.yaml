# Modèle du Secret attendu par l'API et la base — les VRAIES valeurs ne sont
# jamais versionnées. Créer le vrai secret directement dans le cluster :
#
#   kubectl create secret generic todo-secret -n todo \
#     --from-literal=DB_USER=todo_user \
#     --from-literal=DB_PASSWORD=<mot de passe fort> \
#     --from-literal=DB_NAME=todo_db
#
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  DB_USER: a_remplacer
  DB_PASSWORD: a_remplacer
  DB_NAME: a_remplacer
