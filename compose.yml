# Stack de production, déployée sur la machine cible dans /srv/todo.
# Ne construit rien : l'image est téléchargée, la version vient de l'extérieur.
#   cd /srv/todo && TAG=<sha du commit> docker compose up -d
services:
  todo-api:
    container_name: todo-api   # nom fixe : la pipeline et les scripts comptent dessus
    image: nabysarr16/todo-api:${TAG}
    ports:
      - "3000:3000"
    env_file:
      - .env                   # copié une fois à la main, jamais dans le dépôt
    depends_on:
      todo-db:
        condition: service_healthy
    restart: unless-stopped

  todo-db:
    container_name: todo-db
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # La surveillance vit dans la même stack, sur le même réseau :
  # Prometheus joint l'API par son nom de service, aucun port interne exposé.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.53.0
    volumes:
      - /srv/todo/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    volumes:
      - /srv/todo/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /srv/todo/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  todo_pgdata:
  grafana_data:
