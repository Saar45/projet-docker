name: CI

# Toutes les branches lancent les tests ; seule main publie.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  test-integration:
    runs-on: ubuntu-latest
    # Une vraie base PostgreSQL à côté du job, le temps du job.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        # Sans ce healthcheck, les tests démarrent avant la base et échouent
        # de façon intermittente.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dans un services: GitHub Actions, la base est joignable sur localhost,
      # pas par son nom de service comme dans un docker-compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: test
      DB_NAME: todo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  build:
    # On ne publie jamais une image dont les tests sont rouges,
    # et jamais depuis une branche de travail.
    needs: [test, test-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le sha du commit comme tag : on saura toujours quel code tourne,
          # et le rollback devient une commande.
          tags: ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}

  deploy:
    # Rien ne se déploie avant que l'image existe, et seulement depuis main.
    needs: build
    if: github.ref == 'refs/heads/main'
    # Le runner self-hosted partage la machine du cluster : le job n'a besoin
    # ni de clé SSH ni de secret supplémentaire, juste du kubectl local qui
    # lit le kubeconfig du poste.
    runs-on: self-hosted
    steps:
      - name: Rendre kubectl visible du job
        run: echo "/usr/local/bin" >> "$GITHUB_PATH"
      - name: Mettre à jour l'image du Deployment
        run: kubectl --context k3d-todo-cluster set image deployment/todo-api todo-api=${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }} -n todo
      - name: Attendre la convergence du rollout
        # Si le rollout ne converge pas (image introuvable, pod qui crashe),
        # cette commande ne rend jamais la main : le timeout fait échouer le
        # job — la pipeline refuse de déclarer un succès qu'elle n'a pas.
        run: kubectl --context k3d-todo-cluster rollout status deployment/todo-api -n todo --timeout=180s
