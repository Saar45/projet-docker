name: CI

# Toutes les branches lancent les tests ; seule main publie.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    # On ne publie jamais une image dont les tests sont rouges,
    # et jamais depuis une branche de travail.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le sha du commit comme tag : on saura toujours quel code tourne,
          # et le rollback devient une commande.
          tags: ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}
