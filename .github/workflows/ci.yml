name: CI

# Toutes les branches lancent les tests ; seule main publie.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  test-integration:
    runs-on: ubuntu-latest
    # Une vraie base PostgreSQL à côté du job, le temps du job.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        # Sans ce healthcheck, les tests démarrent avant la base et échouent
        # de façon intermittente.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dans un services: GitHub Actions, la base est joignable sur localhost,
      # pas par son nom de service comme dans un docker-compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: test
      DB_NAME: todo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration

  build:
    # On ne publie jamais une image dont les tests sont rouges,
    # et jamais depuis une branche de travail.
    needs: [test, test-integration]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le sha du commit comme tag : on saura toujours quel code tourne,
          # et le rollback devient une commande.
          tags: ${{ secrets.DOCKERHUB_USER }}/todo-api:${{ github.sha }}

  deploy:
    # Rien ne se déploie avant que l'image existe, et seulement depuis main.
    needs: build
    if: github.ref == 'refs/heads/main'
    # Ce job tourne chez nous, à côté de la machine cible : le runner GitHub
    # hébergé ne pourrait jamais joindre une machine derrière une box.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # La clé privée vit dans un agent SSH, en mémoire seulement :
      # jamais écrite sur le disque du runner.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Envoyer le compose de production et la config de monitoring
        run: scp -P ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -r compose.yml monitoring ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/
      - name: Déployer la version du commit
        run: ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cd /srv/todo && TAG=${{ github.sha }} docker compose up -d"
      - name: Vérifier que l'API répond
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://${{ secrets.DEPLOY_HOST }}:3000/health > /dev/null; then
              echo "API en ligne :" && curl -s http://${{ secrets.DEPLOY_HOST }}:3000/health
              exit 0
            fi
            sleep 2
          done
          echo "L'API ne répond pas après le déploiement" && exit 1
